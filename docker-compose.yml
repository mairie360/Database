networks:
  default:

services:
  # --- DATABASE ---
  database:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mairie360-db
    networks:
      - default
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- LIQUIBASE ---
  liquibase:
    build:
      context: .
      dockerfile: liquibase/Dockerfile
    container_name: mairie360-liquibase
    networks:
      - default
    depends_on:
      database:
        condition: service_healthy
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://mairie360-db:5432/core
      - LIQUIBASE_COMMAND_USERNAME=postgres
      - LIQUIBASE_COMMAND_PASSWORD=password
      - LIQUIBASE_SEARCH_PATH=/migrations,/migrations/releases/v1.0.0,/migrations/releases/v1.1.0,/migrations/releases/v1.2.0,/migrations/releases/v1.3.0,/migrations/releases/v1.4.0,/migrations/repeatable
    # -D<role>_password: per-API role passwords (repeatable/security/api_roles.sql),
    # dev-only values. They must come after the command for Liquibase 5.
    command: >
      --changelog-file=changelog.xml
      update
      -Dcore_api_password=password
      -Dproject_api_password=password
      -Dcalendar_api_password=password
      -Dmessage_api_password=password
      -Delearning_api_password=password
