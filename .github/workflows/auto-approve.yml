name: Auto Approve Renovate
on: pull_request_target

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # On ajoute explicitement les permissions ici
    permissions:
      pull-requests: write
      contents: write
    if: github.actor == 'renovate[bot]'
    steps:
      # Non-critical: only approves Renovate PRs, so the mutable tag is accepted.
      - uses: hmarr/auto-approve-action@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # - uses: hmarr/auto-approve-action@v4
      #   with:
      #     github-token: ${{ secrets.MY_TECH_ACCOUNT_PAT }}