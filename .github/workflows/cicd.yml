name: Database CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]  # other branches are covered by the pull_request run
  pull_request:

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless signature in release-dev (CICD v4)

jobs:
  Database-cicd:
    uses: mairie360/CICD/.github/workflows/database_cicd.yml@v4.2.0
    with:
      package_name: database
      cicd_version: v4.0.1
    secrets:
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
