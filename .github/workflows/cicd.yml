name: Database CI/CD

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  Database-cicd:
    uses: mairie360/CICD/.github/workflows/database_cicd.yml@v4.0.0
    with:
      package_name: database
      cicd_version: v4.0.0
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
