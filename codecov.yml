# MAIR-239: the PL/pgSQL line coverage is measured on executable lines only
# (tests/coverage/generate_lcov.py), 96 % when this gate was set. A PR fails
# when the project drops below 90 % (2 % of slack for a refactor that moves
# lines) or when the lines it changes are covered below 80 %.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 80%
