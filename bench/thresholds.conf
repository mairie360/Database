# Thresholds checked by bench/run.sh, one line per script:
#   <script>  <max blocks/txn at scale 1>  <max growth scale 2 / scale 1>  <max avg ms at scale 1>
# blocks and growth depend on the plans and the data, not on the machine:
#   - blocks: about 1.5x the measured value (run-to-run noise is under 10%);
#   - growth: 1.3 at most, i.e. doubling the data must not double the work.
# ms depends on the machine: loose safety net for CPU-bound or lock-bound
# regressions only.

calendar_event_access         80   1.3    100
# Trigram indexes of releases/v1.11.0 (MAIR-477): 126 blocks, growth 1.20.
core_directory_search        190   1.3     50
message_list_chats           220   1.3     50
message_read_chat            105   1.3     50
message_send_and_ack         460   1.3    300
project_tasks                125   1.3     50
project_task_update           75   1.3    100

# Known not to hold as the data grows (they scan instead of using an index),
# tolerated until fixed; then set them like the lines above.
# MAIR-477:
calendar_range            500000   6.0  10000
project_list_responsable   60000   2.5   3000
