# Maximum average latency (ms) per pgbench script, checked by bench/run.sh.
# Set at about 3x a run on a heavily loaded laptop (10 ms minimum), so a breach
# on a GitHub runner means a real regression, not noise.
#
# Known slow queries, tolerated until MAIR-477 rewrites them (then lower
# these three to 20):
calendar_range              6000
core_directory_search       1000
project_list_responsable    2000

calendar_event_access         20
message_list_chats            10
message_read_chat             10
message_send_and_ack         200
project_list                  20
project_tasks                 25
project_task_update          100
