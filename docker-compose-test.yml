services:
  # --- DATABASE ---
  database:
    build:
      context: .
      dockerfile: tests/db.Dockerfile
    container_name: mairie360-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core
    # shared_preload_libraries + profiler on : nécessaire pour que plpgsql_check
    # trace l'exécution ligne à ligne des fonctions PL/pgSQL pendant les tests
    command: postgres -c shared_preload_libraries=plpgsql,plpgsql_check -c plpgsql_check.profiler=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- TESTER ---
  tester:
    build:
      context: .
      dockerfile: tests/test.Dockerfile
    container_name: mairie360-tester
    environment:
      - PGPASSWORD=password
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://database:5432/core
      - LIQUIBASE_COMMAND_USERNAME=postgres
      - LIQUIBASE_COMMAND_PASSWORD=password
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog.xml
      - LIQUIBASE_COMMAND_DRIVER=org.postgresql.Driver
      # On pointe précisément là où sont tes fichiers (vu dans ton ls -la)
      - LIQUIBASE_SEARCH_PATH=/workspace/liquibase,/workspace/liquibase/releases/v1.0.0,/workspace/liquibase/releases/v1.1.0,/workspace/liquibase/releases/v1.2.0,/workspace/liquibase/releases/v1.3.0,/workspace/liquibase/repeatable
    volumes:
      - ./coverage:/workspace/coverage
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "
      echo '--- RUNNING MIGRATIONS ---' &&
      liquibase update
      -Dcore_api_password=password
      -Dproject_api_password=password
      -Dcalendar_api_password=password
      -Dmessage_api_password=password
      -Delearning_api_password=password &&

      echo '--- INSTALLING PGTAP + PLPGSQL_CHECK ---' &&
      psql -h database -U postgres -d core -c 'CREATE EXTENSION IF NOT EXISTS pgtap;' &&
      psql -h database -U postgres -d core -c 'CREATE EXTENSION IF NOT EXISTS plpgsql_check;' &&

      echo '--- RUNNING TESTS ---' &&
      pg_prove -h database -U postgres -d core /workspace/tests/*.sql &&

      echo '--- GENERATING COVERAGE ---' &&
      python3 /workspace/tests/coverage/generate_lcov.py
      "
